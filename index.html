<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            z-index: -1;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: start;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .voice-agent-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 500px;
        }

        .rag-upload-section {
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #48cae4, #0077b6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 202, 228, 0.3);
        }

        .file-name {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .process-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .process-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(255, 107, 107, 0.3);
        }

        .process-btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            transform: none;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            color: white;
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.5;
        }

        .status-container {
            margin-bottom: 40px;
            position: relative;
        }

        .status {
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
            transition: all 0.3s ease;
        }

        .status.disconnected .status-indicator {
            background: #ff6b6b;
            box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7);
        }

        .status.connecting .status-indicator {
            background: #feca57;
            animation: pulse 1.5s infinite;
        }

        .status.connected .status-indicator {
            background: #48cae4;
            animation: pulse-success 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(254, 202, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(254, 202, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(254, 202, 87, 0); }
        }

        @keyframes pulse-success {
            0% { box-shadow: 0 0 0 0 rgba(72, 202, 228, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(72, 202, 228, 0); }
            100% { box-shadow: 0 0 0 0 rgba(72, 202, 228, 0); }
        }

        .connect-button {
            position: relative;
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .connect-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
        }

        .connect-button:active {
            transform: translateY(-1px);
        }

        .connect-button.connected {
            background: linear-gradient(135deg, #48cae4, #0077b6);
            box-shadow: 0 10px 25px rgba(72, 202, 228, 0.3);
        }

        .connect-button.connected:hover {
            box-shadow: 0 15px 35px rgba(72, 202, 228, 0.4);
        }

        .connect-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .connect-button:active::before {
            width: 100px;
            height: 100px;
        }

        .button-icon {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .wave-container {
            width: 150px;
            height: 40px;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
        }

        .wave-container.active {
            opacity: 1;
        }

        .wave {
            width: 3px;
            height: 15px;
            background: rgba(255, 255, 255, 0.6);
            margin: 0 2px;
            border-radius: 2px;
            animation: wave 1.2s ease-in-out infinite;
        }

        .wave:nth-child(2) { animation-delay: 0.1s; }
        .wave:nth-child(3) { animation-delay: 0.2s; }
        .wave:nth-child(4) { animation-delay: 0.3s; }
        .wave:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(2.5); }
        }

        .microphone-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .microphone-icon.active {
            background: rgba(72, 202, 228, 0.2);
            color: #48cae4;
            animation: pulse-mic 1.5s infinite;
        }

        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(72, 202, 228, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(72, 202, 228, 0); }
            100% { box-shadow: 0 0 0 0 rgba(72, 202, 228, 0); }
        }
        .avatar-card {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            position: relative;
        }
 
        video {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            object-fit: cover;
            background-color: #000;
            display: none;
        }
 
        video.fullscreen {
            display: block;
        }
 
        @media (max-width: 1024px) {
            .main-container { grid-template-columns: 1fr; }
            .voice-agent-card, .avatar-card { min-height: 400px; }
        }

        .footer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            text-align: center;
            font-weight: 500;
        }
        .session-logs-btn {
            position: fixed;
            top: 32px;
            right: 40px;
            z-index: 100;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-weight: 600;
            padding: 11px 28px;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px rgba(102,126,234,0.1), 0 1.5px 6px rgba(76,75,162,0.12);
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
         }
         .session-logs-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            box-shadow: 0 8px 32px rgba(118,75,162,0.19);
            transform: translateY(-2px) scale(1.03);
         }
         @media (max-width: 700px) {
            .session-logs-btn {
                top: 12px;
                right: 12px;
                padding: 8px 15px;
                font-size: 14px;
            }
         }


        /* Responsive design */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 0 10px;
            }
            
            .card {
                padding: 30px 25px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .connect-button {
                width: 80px;
                height: 80px;
                font-size: 16px;
            }

            .voice-agent-card {
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="background-blur"></div>
    <button id="session-logs-btn" class="session-logs-btn">Session Logs</button>
    <div id="session-log-list" style="display:none; padding:16px 20px; background:#292965; border-radius:16px; color:white; max-width:540px; margin:20px auto; z-index:20; position:relative"></div>
    <div class="main-container">
        <div class="card voice-agent-card">
            <div class="microphone-icon" id="mic-icon">🎤</div>

            <div class="logo">AI</div>

            <h1>Voice Agent</h1>
            <p class="subtitle">Intelligent voice assistant powered by AI</p>

            <div id="rag-section" style="display: none;">
                <div class="rag-upload-section">
                    <input type="file" id="pdf-file" class="file-input" accept=".pdf">
                    <button class="upload-btn" id="upload-btn">Choose PDF</button>
                    <div class="file-name" id="file-name">No file selected</div>
                    <button class="process-btn" id="process-btn" disabled>Process PDF</button>
                </div>
            </div>

            <div class="status-container">
                <div class="status disconnected" id="status">
                    <span class="status-indicator"></span>
                    <span id="status-text">Ready to Connect</span>
                </div>
            </div>

            <button class="connect-button" id="connect-btn">
                <span class="button-icon" id="button-icon">▶</span>
            </button>

            <div class="wave-container" id="wave-container">
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
                <div class="wave"></div>
            </div>
        </div>
        
        <div class="card avatar-card">
            <video id="video-el" autoplay playsinline muted></video>
        </div>        
    </div>
    <div class="footer">
            Secure • Private • Real-time
    </div>

    <audio id="audio-el" autoplay></audio>

    <script>
        // Check if user is logged in
        if (!localStorage.getItem('selectedOption')) {
            window.location.href = '/login';
        }

        const selectedOption = localStorage.getItem('selectedOption');
        let sessionId = null;

        // Set baseUrl based on selected option
        let baseUrl;
        if (selectedOption === 'rag') {
            baseUrl = 'http://localhost:8000';
        } else if (selectedOption === 'no-rag') {
            baseUrl = 'http://localhost:8001';
        } else {
            baseUrl = 'http://localhost:8000'; // default
        }

        const statusEl = document.getElementById("status")
        const statusTextEl = document.getElementById("status-text")
        const buttonEl = document.getElementById("connect-btn")
        const buttonIconEl = document.getElementById("button-icon")
        const audioEl = document.getElementById("audio-el")
        const micIconEl = document.getElementById("mic-icon")
        const waveContainerEl = document.getElementById("wave-container")

        // NEW VIDEO ELEMENTS
        const videoEl = document.getElementById("video-el")

        let connected = false
        let peerConnection = null

        const waitForIceGatheringComplete = async (pc, timeoutMs = 2000) => {
            if (pc.iceGatheringState === 'complete') return;
            console.log("Waiting for ICE gathering to complete. Current state:", pc.iceGatheringState);
            return new Promise((resolve) => {
                let timeoutId;
                const checkState = () => {
                    console.log("icegatheringstatechange:", pc.iceGatheringState);
                    if (pc.iceGatheringState === 'complete') {
                        cleanup();
                        resolve();
                    }
                };
                const onTimeout = () => {
                    console.warn(`ICE gathering timed out after ${timeoutMs} ms.`);
                    cleanup();
                    resolve();
                };
                const cleanup = () => {
                    pc.removeEventListener('icegatheringstatechange', checkState);
                    clearTimeout(timeoutId);
                };
                pc.addEventListener('icegatheringstatechange', checkState);
                timeoutId = setTimeout(onTimeout, timeoutMs);
                checkState();
            });
        };

        const createSmallWebRTCConnection = async (audioTrack) => {

            const iceServers = [
         { urls: "stun:34.14.202.215:3479" },
         { urls: "turn:34.14.202.215:3479?transport=udp", username: "test", credential: "test123"},
         { urls: "turn:34.14.202.215:3479?transport=tcp", username: "test", credential: "test123"}
     ];
            const pc = new RTCPeerConnection({ iceServers });
            addPeerConnectionEventListeners(pc)
            pc.ontrack = (event) => {
              if (event.track.kind === "video") {
                videoEl.srcObject = event.streams[0];
                videoEl.style.display = "block";
              }
              if (event.track.kind === "audio") {
                audioEl.srcObject = event.streams[0];
              }
            };
            /*pc.ontrack = e => audioEl.srcObject = e.streams[0]*/
            pc.addTransceiver(audioTrack, { direction: 'sendrecv' })
            pc.addTransceiver('video', { direction: 'sendrecv' })
            await pc.setLocalDescription(await pc.createOffer())
            await waitForIceGatheringComplete(pc)
            const offer = pc.localDescription
            const offerData = { sdp: offer.sdp, type: offer.type };
            if (sessionId) {
                offerData.session_id = sessionId;
            }
            const response = await fetch(`${baseUrl}/api/offer`, {
                body: JSON.stringify(offerData),
                headers: { 'Content-Type': 'application/json' },
                method: 'POST',
            });
            const answer = await response.json()
            await pc.setRemoteDescription(answer)
            return pc
        }

        const connect = async () => {
            _onConnecting()
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({audio: true})
                peerConnection = await createSmallWebRTCConnection(audioStream.getAudioTracks()[0])
            } catch (error) {
                console.error("Connection failed:", error)
                _onDisconnected()
            }
        }

        const addPeerConnectionEventListeners = (pc) => {
            pc.oniceconnectionstatechange = () => {
                console.log("oniceconnectionstatechange", pc?.iceConnectionState)
            }
            pc.onconnectionstatechange = () => {
                console.log("onconnectionstatechange", pc?.connectionState)
                let connectionState = pc?.connectionState
                if (connectionState === 'connected') {
                    _onConnected()
                } else if (connectionState === 'disconnected') {
                    _onDisconnected()
                }
            }
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    console.log("New ICE candidate:", event.candidate);
                } else {
                    console.log("All ICE candidates have been sent.");
                }
            };
        }

        const _onConnecting = () => {
            statusEl.className = "status connecting"
            statusTextEl.textContent = "Connecting..."
            buttonEl.classList.remove("connected")
            buttonIconEl.textContent = "⏸"
            micIconEl.classList.remove("active")
            waveContainerEl.classList.remove("active")
            connected = true
        }

        const _onConnected = () => {
            statusEl.className = "status connected"
            statusTextEl.textContent = "Connected & Listening"
            buttonEl.classList.add("connected")
            buttonIconEl.textContent = "⏹"
            micIconEl.classList.add("active")
            waveContainerEl.classList.add("active")
            connected = true
        }

        const _onDisconnected = () => {
            statusEl.className = "status disconnected"
            statusTextEl.textContent = "Ready to Connect"
            buttonEl.classList.remove("connected")
            buttonIconEl.textContent = "▶"
            micIconEl.classList.remove("active")
            waveContainerEl.classList.remove("active")
            connected = false
        }

        const disconnect = () => {
            if (!peerConnection) {
                return
            }
            peerConnection.close()
            peerConnection = null
            _onDisconnected()
        }

        buttonEl.addEventListener("click", async () => {
            if (!connected) {
                await connect()
            } else {
                disconnect()
            }
        });

        // Show RAG section if selected option is 'rag'
        if (selectedOption === 'rag') {
            document.getElementById('rag-section').style.display = 'block';
        }

        // RAG functionality
        const uploadBtn = document.getElementById('upload-btn');
        const pdfFileInput = document.getElementById('pdf-file');
        const fileNameEl = document.getElementById('file-name');
        const processBtn = document.getElementById('process-btn');

        uploadBtn.addEventListener('click', () => {
            pdfFileInput.click();
        });

        pdfFileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                fileNameEl.textContent = file.name;
                processBtn.disabled = false;
            } else {
                fileNameEl.textContent = 'No file selected';
                processBtn.disabled = true;
            }
        });

        processBtn.addEventListener('click', async () => {
            const file = pdfFileInput.files[0];
            if (!file) return;

            processBtn.disabled = true;
            processBtn.textContent = 'Processing...';

            try {
                // Upload PDF
                const formData = new FormData();
                formData.append('file', file);

                const uploadResponse = await fetch(`${baseUrl}/pdf/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error('Upload failed');
                }

                const uploadResult = await uploadResponse.json();
                sessionId = uploadResult.session_id;

                // Process PDF
                const processResponse = await fetch(`${baseUrl}/pdf/process`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                if (!processResponse.ok) {
                    throw new Error('Processing failed');
                }

                const processResult = await processResponse.json();

                processBtn.textContent = 'Processed!';
                processBtn.style.background = 'linear-gradient(135deg, #48cae4, #0077b6)';
                alert('PDF processed successfully! You can now connect.');

            } catch (error) {
                console.error('Error processing PDF:', error);
                processBtn.textContent = 'Process PDF';
                processBtn.disabled = false;
                alert('Error processing PDF. Please try again.');
            }
        });

        // Add some interactive effects
        buttonEl.addEventListener('mouseenter', () => {
            if (!connected) {
                buttonEl.style.transform = 'translateY(-5px) scale(1.05)'
            }
        });

        buttonEl.addEventListener('mouseleave', () => {
            if (!connected) {
                buttonEl.style.transform = 'translateY(0) scale(1)'
            }
        });

            if (transcriptionContainer.querySelector('.transcription-placeholder')) {
                transcriptionContainer.innerHTML = '';
            }
            transcriptionContainer.textContent += `[${timestamp}] [${role.toUpperCase()}] ${text}\n`;
            transcriptionContainer.scrollTop = transcriptionContainer.scrollHeight;
            
        };

            let logDiv = document.getElementById("session-log-list");

            let logs = await resp.json();

                    </li>`;
                }
                html += "</ul>";
            }
            logDiv.innerHTML = html;
            logDiv.style.display = "block";
        };
        */
    </script>
</body>
</html>
